name: Build, test and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_DRIVER_URL: ${{ vars.VITE_DRIVER_URL }}
          VITE_ADMIN_URL: ${{ vars.VITE_ADMIN_URL }}
          VITE_SHELL_URL: ${{ vars.VITE_SHELL_URL }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
      - uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: dist
  deploy:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend
          path: dist
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Publish independent frontend build
        env:
          AZURE_STORAGE_ACCOUNT: ${{ vars.STORAGE_ACCOUNT }}
        run: |
          az storage blob upload-batch --source dist --destination '$web' --overwrite --auth-mode key --content-cache-control 'no-cache' --output none
